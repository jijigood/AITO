### LLaMA-Factory SFT Configuration for Track A V3 — ZeRO-3 + CPU offload fallback
###
### Use this when the plain ZeRO-2 config cannot fit the Qwen3.5-35B-A3B base model.

model_name_or_path: /home/huangxiaolin/AITO/model
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora

lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

dataset: sft_v5_with_tools
dataset_dir: /home/huangxiaolin/AITO/V4/Track A
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: /home/huangxiaolin/AITO/V4/Track A/checkpoints/v4_a3_corrected
logging_dir: /home/huangxiaolin/AITO/V4/Track A/checkpoints/v4_a3_corrected_logs
save_strategy: steps
save_steps: 100
save_total_limit: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
num_train_epochs: 3
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true

do_eval: true
eval_dataset: sft_heldout_val
val_size: 0.0
eval_strategy: steps
eval_steps: 100
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

deepspeed: /home/huangxiaolin/AITO/V4/Track A/configs/ds_z3_offload.json

logging_steps: 1
report_to: none
plot_loss: true
