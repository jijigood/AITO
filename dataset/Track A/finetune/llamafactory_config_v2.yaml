### LLaMA-Factory SFT Configuration for Track A V2 — Qwen3.5-35B-A3B LoRA
###
### Training format: 3-message conversations (system + user + assistant)
###   - user:      structured evidence + ranked candidate options (no raw CSV)
###   - assistant: \boxed{C_N} or \boxed{C_N|C_M}
###
### Key differences from llamafactory_config.yaml (V1):
###   - dataset:    sft_v2_train  (generated by prepare_data_v2.py)
###   - cutoff_len: 2048          (vs 8192; examples avg ~656 tokens)
###   - batch_size: 4             (vs 2; shorter seqs allow larger batch)
###   - gradient_accumulation: 4  (vs 8; effective batch = 16, same as V1)
###
### Usage:
###   cd LLaMA-Factory
###   llamafactory-cli train "../Track A/finetune/llamafactory_config_v2.yaml"

# ── Model ──────────────────────────────────────────────────────────────────────
model_name_or_path: /home/huangxiaolin/AITO/model
trust_remote_code: true

# ── Method ─────────────────────────────────────────────────────────────────────
stage: sft
do_train: true
finetuning_type: lora

# LoRA hyperparameters
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

# ── QLoRA — 4-bit quantization ─────────────────────────────────────────────────
# Required: model in BF16 is ~70 GB; 4-bit reduces it to ~18 GB (fits A100 80GB)
quantization_bit: 4
quantization_type: nf4
double_quantization: true      # double-quant saves ~0.37 bits/param extra

# ── Dataset ────────────────────────────────────────────────────────────────────
dataset: track_a_sft_v2_train       # name registered in dataset_info.json
                                     # (points to finetune/sft_v2_train.jsonl)
dataset_dir: /home/huangxiaolin/AITO/dataset/Track A/finetune
template: qwen
cutoff_len: 2048                     # V2 examples average ~656 tokens; 2048 gives headroom
max_samples: 1800
overwrite_cache: true
preprocessing_num_workers: 4

# ── Training ───────────────────────────────────────────────────────────────────
output_dir: /home/huangxiaolin/AITO/dataset/Track A/finetune/lora_output_v2
logging_dir: /home/huangxiaolin/AITO/dataset/Track A/finetune/logs_v2
save_strategy: epoch
save_total_limit: 3
per_device_train_batch_size: 4       # doubled vs V1 (shorter sequences)
gradient_accumulation_steps: 4       # effective batch = 16 (same as V1)
num_train_epochs: 3
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
label_smoothing_factor: 0.0          # exact \boxed{} target — no smoothing needed
bf16: true
# fp16: true                         # use if bf16 not supported

# ── Evaluation ─────────────────────────────────────────────────────────────────
val_size: 0.0                        # validation handled by sft_v2_val.jsonl separately
eval_strategy: "no"

# ── Flash Attention ────────────────────────────────────────────────────────────
flash_attn: disabled                 # enable after: uv pip install flash-attn

# ── DeepSpeed (multi-GPU) ──────────────────────────────────────────────────────
# deepspeed: examples/deepspeed/ds_z3_config.json

# ── Misc ───────────────────────────────────────────────────────────────────────
report_to: none                      # set to "wandb" for W&B logging
plot_loss: true
